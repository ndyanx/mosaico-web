<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />

    <title>Mosaico · Galería de canales de YouTube</title>
    <meta
      name="description"
      content="Explora los videos, shorts y directos de cualquier canal de YouTube en una galería rápida, con vista previa al pasar el cursor. Pega un @handle y listo."
    />
    <meta name="application-name" content="Mosaico" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    %SITE_URL_CANONICAL%

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mosaico" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Mosaico · Galería de canales de YouTube" />
    <meta property="og:description" content="Videos, shorts y directos de cualquier canal de YouTube en una galería rápida. Pega un @handle y explora." />
    %SITE_URL_OG%
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mosaico · Galería de canales de YouTube" />
    <meta name="twitter:description" content="Videos, shorts y directos de cualquier canal de YouTube en una galería rápida." />

    <script>
      // Aplica el tema guardado antes del primer pintado (evita el parpadeo claro/oscuro).
      try {
        var t = JSON.parse(localStorage.getItem("ytgallery:prefs") || "{}").theme;
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Mosaico necesita JavaScript para funcionar.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
